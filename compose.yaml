
services:
  db:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: flaskcrud
      MYSQL_USER: ${MYSQL_USER:-flaskuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flaskpass123}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data_nuevo:/var/lib/mysql
      - ./sql/db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-flaskuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flaskpass123}
      MYSQL_DB: flaskcrud

    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data_nuevo:
